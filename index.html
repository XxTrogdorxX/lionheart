<style>
:root{color-scheme:dark;--bg:#211a15;--card:#2f261f;--ink:#efe2cf;--mut:#b3a08a;--line:#45382d;--ac:#c48a52;--on:#211a15;--ok:#a3b27a;--okbg:#303520;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}


html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:14px 12px 40px}
h1{font-size:22px;margin:4px 0 2px}h2{font-size:17px;margin:0}
.mut{color:var(--mut);font-size:14px}
.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}
.tabs{display:flex;gap:6px;margin:12px 0}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 12px;min-height:44px}
button.pri{background:var(--ac);color:var(--on);border-color:var(--ac)}
.tabs button{flex:1}.tabs button.sel{background:var(--ac);color:var(--on);border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.set{display:grid;grid-template-columns:62px 1fr 1fr 1fr 44px;gap:6px;align-items:center;margin-top:6px}
.set.t{grid-template-columns:62px 1fr 44px}
.set small{display:block;color:var(--mut);font-size:12px}
.set.on{background:var(--okbg);border-radius:10px}
.set.on button{background:var(--ok);color:var(--on);border-color:var(--ok)}
.hd{display:grid;grid-template-columns:62px 1fr 1fr 1fr 44px;gap:6px;font-size:12px;color:var(--mut);margin-top:8px}
.hd.t{grid-template-columns:62px 1fr 44px}
input,select,textarea{font:inherit;font-size:16px;width:100%;min-width:0;padding:9px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.set button{padding:0}
.hist{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:14px}
.hist div{display:flex;justify-content:space-between;padding:2px 0}
.lnk{border:0;background:none;color:var(--ac);padding:4px 0;min-height:0;text-align:left;font-weight:600}
label.f{display:block;font-size:13px;color:var(--mut)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
button.day{width:100%;display:block;text-align:left;padding:14px}
button.day.ok{background:var(--okbg);border-color:var(--ok)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style></head><body><main id="app"></main>
<script>
const D={"prog":{"weeks":12,"timeInc":15,"eq":{"Dumbbell":10,"Barbell":5,"Machine":5,"Cable":10,"Body Weight":0},"days":[{"name":"Day 1","ex":[]}]},"imp":{}};
let S,V={view:"train",open:{},msg:""};
const $=s=>document.querySelector(s);
const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
const h=x=>Math.round(x*2)/2;
const rnd=(x,i)=>i?Math.round(x/i)*i:x;
let last=null,CL=null,dirty=false,tm;
function push(){if(CL){try{CL.set({json:JSON.stringify(S)}).then(()=>{V.sync="cloud"}).catch(()=>{V.sync="local"})}catch(e){}}}
function save(){const j=JSON.stringify(S);try{localStorage.setItem("lh1",j)}catch(e){}
  if(j!==last){last=j;dirty=true;clearTimeout(tm);tm=setTimeout(push,500)}}
function fresh(){
  const s={p:JSON.parse(JSON.stringify(D.prog)),week:1,day:0,logs:{}};
  for(const id in D.imp)for(const wk in D.imp[id]){
    (s.logs[wk]=s.logs[wk]||{})[id]=D.imp[id][wk].split(",").map(x=>{const[a,b]=x.split("x"),[r,i]=b.split("@");return{w:+a,r:+r,i:i===""?null:+i,d:1,pw:+a,pr:+r}});
  }
  return s;
}
try{const x=localStorage.getItem("lh1");S=x?JSON.parse(x):fresh()}catch(e){S=fresh()}
const VER="1.6";
function migrate(s){const v=s.v||1;
  if(s.p&&s.p.eq&&s.p.eq.Timed==null)s.p.eq.Timed=s.p.timeInc||15;
  if(!s.ds)s.ds={};
  if(v<3&&s.p)s.p.days.forEach((d,i)=>{for(let w=1;w<=s.week;w++){const ok=w<s.week||d.ex.every(e=>{const L=(s.logs[w]||{})[e.id];return L&&L.length>=e.ramp.length+e.sets&&L.every(x=>x.d)});if(ok&&d.ex.length)s.ds[w+":"+i]={done:1}}});
  s.v=3;return s}
S=migrate(S);last=JSON.stringify(S);
const exs=()=>S.p.days.flatMap(d=>d.ex);
if(!exs().length)V.view="setup";
const isT=e=>e.eq==="Timed";
const inc=e=>S.p.eq[e.eq]||0;
function wsets(e,k){const L=S.logs[k]&&S.logs[k][e.id];if(!L)return;const w=L.filter((s,i)=>s.d&&i>=e.ramp.length&&s.w>0&&s.r>0);return w.length?w:null}
function prev(e,wk){for(let k=wk-1;k>=1;k--){const w=wsets(e,k);if(w)return{w,k}}}
function calc(e,w){const base=avg(w.map(s=>s.w)),est=avg(w.map(s=>s.w*(1+(s.r+(s.i==null?2:s.i))/30)/(1+(e.goal+2)/30)));return{base,est:rnd(Math.max(base*.9,Math.min(base*1.1,est)),inc(e))}}
const dn=c=>c.est<rnd(c.base,0)-1e-6;
function work(e,wk){
  const p=prev(e,wk);if(!p)return e.start;
  const c=calc(e,p.w),miss=wk-1-p.k;
  if(miss>0)return rnd(c.base*Math.pow(.95,miss),inc(e));
  if(dn(c)){const q=wsets(e,p.k-1);if(!q||!dn(calc(e,q)))return rnd(c.base,inc(e))}
  return c.est;
}
function tgtTime(e,wk){
  for(let k=wk-1;k>=1;k--){
    const L=S.logs[k]&&S.logs[k][e.id];if(!L)continue;
    const g=L.filter(s=>s.d);if(!g.length)continue;
    const t0=L[0].pr||e.goal;
    return g.every(s=>s.r>=t0)?t0+(S.p.eq.Timed||15):t0;
  }
  return e.goal;
}
function gen(e,wk){
  if(isT(e)){const t=tgtTime(e,wk);return Array.from({length:e.sets},()=>({pw:0,pr:t,d:0}))}
  const W=work(e,wk);
  return e.ramp.map(p=>({pw:h(W*p),pr:e.goal,d:0})).concat(Array.from({length:e.sets},()=>({pw:W,pr:e.goal,d:0})));
}
function ens(wk,e){
  const lg=S.logs[wk]=S.logs[wk]||{};const L=lg[e.id]=lg[e.id]||[];
  if(L.length<e.ramp.length+e.sets){const g=gen(e,wk);for(let i=L.length;i<g.length;i++)L.push(g[i])}
  return L;
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>+(+n).toFixed(1);
function dayDone(d){return d.ex.every(e=>ens(S.week,e).every(s=>s.d))}
function hist(e){
  const out=[];
  for(let k=S.week-1;k>=1;k--){
    const L=S.logs[k]&&S.logs[k][e.id];if(!L)continue;
    const g=L.filter((s,i)=>s.d&&(isT(e)||i>=e.ramp.length));if(!g.length)continue;
    if(isT(e))out.push([k,Math.max(...g.map(s=>s.r))+" sec"]);
    else{const t=g.reduce((a,b)=>b.w>=a.w?b:a);out.push([k,fmt(t.w)+" × "+t.r+(t.i==null?"":" (RIR "+t.i+")")])}
  }
  return out.length?out.map(x=>`<div><span>Week ${x[0]}</span><span>${x[1]}</span></div>`).join(""):`<div class="mut">No past weeks logged yet.</div>`;
}
function exCard(e){
  const L=ens(S.week,e),t=isT(e),open=V.open[e.id];let n=0;
  const rows=L.map((s,i)=>{
    const ramp=i<e.ramp.length&&!t,lab=ramp?"Ramp":"Set "+(++n);
    const tg=t?fmt(s.pr)+" sec":fmt(s.pw)+" × "+s.pr;
    const v=(a,b)=>s.d||s[a]!=null?(s[a]==null?"":s[a]):b;
    const inp=(k,m,val,ph)=>`<input inputmode="${m}" data-k="${k}" placeholder="${ph}" value="${val==null?"":val}">`;
    return t?`<div class="set t${s.d?" on":""}" data-e="${e.id}" data-i="${i}"><span>${lab}<small>${tg}</small></span>${inp("r","numeric",v("r",s.pr),"sec")}<button data-a="ck" aria-label="Log set">✓</button></div>`
    :`<div class="set${s.d?" on":""}" data-e="${e.id}" data-i="${i}"><span>${lab}<small>${tg}</small></span>${inp("w","decimal",v("w",s.pw),"lb")}${inp("r","numeric",v("r",s.pr),"reps")}${inp("i","numeric",s.i,"RIR")}<button data-a="ck" aria-label="Log set">✓</button></div>`;
  }).join("");
  return `<section class="card"><div class="row sp"><h2>${esc(e.name)}</h2><button class="lnk" data-a="hist" data-e="${e.id}">${open?"Hide":"History"}</button></div>
<div class="mut">${e.sets} sets · goal ${t?e.goal+" sec":e.goal+" reps"}${e.ramp.length&&!t?" · ramp "+e.ramp.map(x=>Math.round(x*100)+"%").join(", "):""}</div>
<div class="hd${t?" t":""}"><span></span>${t?"<span>seconds</span>":"<span>weight</span><span>reps</span><span>RIR</span>"}<span></span></div>${rows}
${open?`<div class="hist">${hist(e)}</div>`:""}</section>`;
}
const DS=i=>(S.ds[S.week+":"+i]=S.ds[S.week+":"+i]||{});
const mins=d=>Math.max(1,Math.round((d.e-d.s)/6e4));
function train(){
  const days=S.p.days,all=days.length&&days.every((d,i)=>DS(i).done),last=S.week>=S.p.weeks;
  const cards=days.map((d,i)=>{const s=DS(i),L=d.ex.flatMap(e=>ens(S.week,e)),n=L.filter(x=>x.d).length;
    const st=s.done?"Completed"+(s.s&&s.e?" · "+mins(s)+" min":""):n?`In progress · ${n}/${L.length} sets`:"Not started";
    return `<button class="card day${s.done?" ok":""}" data-a="open" data-i="${i}"><div class="row sp"><h2>${esc(d.name)}</h2><span>${s.done?"✓":"›"}</span></div><div class="mut">${st} · ${d.ex.length} exercises</div></button>`}).join("");
  return `<div class="row sp"><div><h1>Lionheart Lifting</h1><div class="mut">Week ${S.week} of ${S.p.weeks} · ${V.sync==="cloud"?"saved to your account":"saved on this phone only"}</div></div><button data-a="setup">Setup</button></div>
<div style="margin-top:12px">${cards||'<section class="card"><div class="mut">No days yet. Open Setup to add some.</div></section>'}</div>
<button class="${all?"pri":""}" style="width:100%" data-a="next" ${last?"disabled":""}>${last?"Block complete":V.ask==="next"?(all?"":"Some days aren’t complete. ")+"Tap again to start week "+(S.week+1):all?"All days done · Start next week":"Start next week"}</button><div class="mut" style="margin-top:8px;text-align:center">${V.msg||(Object.keys(S.logs).length&&(!S.bk||Date.now()-S.bk>6048e5)?"Tip: it’s been a while since your last backup (Setup → Backup).":"")}</div>`;
}
function dayPage(){
  const i=V.di,d=S.p.days[i],s=DS(i),tm=x=>new Date(x).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
  const info=s.done?"Completed"+(s.s&&s.e?" · "+mins(s)+" min":""):s.s?"Started "+tm(s.s):"";
  return `<div class="row sp"><button data-a="home">‹ Week ${S.week}</button><div class="mut">${info}</div></div><h1 style="margin-top:8px">${esc(d.name)}</h1>
${!s.s&&!s.done?'<button class="pri" style="width:100%;margin-bottom:12px" data-a="start">Start workout</button>':""}
${d.ex.length?d.ex.map(exCard).join(""):'<section class="card"><div class="mut">No exercises yet. Add some in Setup.</div></section>'}
${s.done?'<button style="width:100%" data-a="reopen">Reopen day</button>':'<button class="pri" style="width:100%" data-a="fin">Complete day</button>'}`;
}
function setup(){
  const p=S.p,eqs=Object.keys(p.eq);
  const tabs=exs().length?"":`<div class="tabs"><button class="${V.tab==="restore"?"":"sel"}" data-a="tab" data-t="new">Start from scratch</button><button class="${V.tab==="restore"?"sel":""}" data-a="tab" data-t="restore">Restore from backup</button></div>`;
  if(!exs().length&&V.tab==="restore")return `<h1>Welcome</h1>${tabs}<section class="card"><h2>Restore from backup</h2><div class="mut">Paste the backup text you saved from another phone or an earlier session, then tap Restore.</div><textarea id="bk" rows="6" style="margin-top:8px"></textarea><button class="pri" style="width:100%;margin-top:8px" data-a="imp">Restore from text</button><div class="mut" id="bm"></div></section>`;
  const f=(lab,path,val,n)=>`<label class="f">${lab}<input data-p="${path}" ${n?'data-n="1" inputmode="decimal"':""} value="${esc(val)}"></label>`;
  return `<div class="row sp"><h1>Setup</h1><button class="pri" data-a="back">Done</button></div>
${tabs}${exs().length?"":`<div class="mut" style="margin-bottom:10px">Add your days and exercises below, then tap Done. Set Current week to where you are in your block.</div>`}
<section class="card"><h2>Block</h2><div class="g">${f("Weeks in block","weeks",p.weeks,1)}</div>
<div style="margin-top:8px" class="mut">Current week: <input style="width:70px;display:inline" data-p="__week" data-n="1" inputmode="numeric" value="${S.week}"></div></section>
<section class="card"><h2>Equipment increments</h2><div class="mut">Weights in lb. Timed is in seconds.</div>${eqs.map(q=>`<div class="g" style="grid-template-columns:1fr 90px 44px"><input data-q="${esc(q)}" data-a2="eqn" value="${esc(q)}" ${q==="Timed"?"disabled":""}><input data-q="${esc(q)}" data-a2="eqv" inputmode="decimal" value="${p.eq[q]}"><button data-a="deq" data-q="${esc(q)}" ${q==="Timed"?"disabled":""}>✕</button></div>`).join("")}<button style="margin-top:8px" data-a="aeq">Add equipment</button></section>
${p.days.map((d,di)=>`<section class="card"><div class="row sp">${f("Day name",`days.${di}.name`,d.name)}<button data-a="dday" data-i="${di}">${V.ask==="d"+di?"Tap again to remove":"Remove day"}</button></div>
${d.ex.map((e,ei)=>{const b=`days.${di}.ex.${ei}.`;return `<div class="card" style="background:var(--bg)">${f("Exercise",b+"name",e.name)}<div class="g"><label class="f">Equipment<select data-p="${b}eq">${eqs.map(q=>`<option ${q==e.eq?"selected":""}>${esc(q)}</option>`).join("")}</select></label>
${f("Sets",b+"sets",e.sets,1)}${f("Start weight",b+"start",e.start,1)}${f(isT(e)?"Goal (sec)":"Goal reps",b+"goal",e.goal,1)}</div>
${isT(e)?"":`<label class="f" style="margin-top:8px">Ramp % (blank = none, e.g. 50, 80)<input data-p="${b}ramp" data-r="1" value="${e.ramp.map(x=>Math.round(x*100)).join(", ")}"></label>`}
<button style="margin-top:8px" data-a="dex" data-d="${di}" data-i="${ei}">Remove exercise</button></div>`}).join("")}<button data-a="aex" data-i="${di}">Add exercise</button></section>`).join("")}
<button style="width:100%;margin-bottom:12px" data-a="aday">Add day</button>
<section class="card"><h2>Backup</h2><div class="mut">Optional. Copy the text and keep it in Notes. Paste it back to restore.</div><div class="mut">Last backup: ${S.bk?new Date(S.bk).toLocaleDateString():"never"} · App v${VER}</div><textarea id="bk" rows="4"></textarea><div class="row" style="margin-top:8px"><button data-a="exp">Copy backup</button><button data-a="imp">Restore from text</button></div><div class="mut" id="bm"></div></section>`;
}
function render(){if(V.view==="day"&&!S.p.days[V.di])V.view="train";$("#app").innerHTML=V.view==="train"?train():V.view==="day"?dayPage():setup();save()}
const setPath=(o,path,v)=>{const k=path.split(".");let c=o;for(let i=0;i<k.length-1;i++)c=c[k[i]];c[k[k.length-1]]=v};
document.addEventListener("change",ev=>{
  const t=ev.target;
  if(t.dataset.k){const row=t.closest(".set"),e=exs().find(x=>x.id===row.dataset.e),s=ens(S.week,e)[+row.dataset.i];
    s[t.dataset.k]=t.value===""?null:+t.value;save();return}
  if(t.dataset.a2){const q=t.dataset.q,eq=S.p.eq;
    if(t.dataset.a2==="eqv")eq[q]=+t.value||0;
    else if(t.value&&t.value!==q&&!(t.value in eq)){const n={};for(const k in eq)n[k===q?t.value:k]=eq[k];S.p.eq=n;exs().forEach(e=>{if(e.eq===q)e.eq=t.value})}
    render();return}
  if(t.dataset.p){const p=t.dataset.p;let v=t.value;
    if(t.dataset.r)v=v.split(/[ ,]+/).filter(Boolean).map(x=>+x/100).filter(x=>x>0);
    else if(t.dataset.n)v=+v||0;
    if(p==="__week")S.week=Math.max(1,Math.min(S.p.weeks,v||1));else setPath(S.p,p,v);
    render()}
});
document.addEventListener("click",ev=>{
  const b=ev.target.closest("button[data-a]");if(!b)return;
  const a=b.dataset.a,i=+b.dataset.i;if(a!=="next"&&a!=="dday")V.ask=null;
  if(a==="ck"){const row=b.closest(".set"),e=exs().find(x=>x.id===row.dataset.e),s=ens(S.week,e)[+row.dataset.i];
    row.querySelectorAll("input").forEach(n=>{if(n.value!=="")s[n.dataset.k]=+n.value});
    if(!s.d){if(isT(e)){if(s.r==null)s.r=s.pr}else{if(s.w==null)s.w=s.pw;if(s.r==null)s.r=s.pr}}
    s.d=s.d?0:1;{const q=DS(V.di);if(s.d&&!q.s)q.s=Date.now()}render();return}
  if(a==="hist"){V.open[b.dataset.e]=!V.open[b.dataset.e]}
  else if(a==="day")S.day=i;
  else if(a==="next"){if(V.ask!=="next")V.ask="next";else{V.ask=null;S.week++;S.day=0;V.open={};scrollTo(0,0)}}
  else if(a==="tab"){V.tab=b.dataset.t}
  else if(a==="open"){V.view="day";V.di=i;scrollTo(0,0)}
  else if(a==="home"){V.view="train";scrollTo(0,0)}
  else if(a==="start"){DS(V.di).s=Date.now()}
  else if(a==="fin"){const q=DS(V.di);q.e=Date.now();q.done=1}
  else if(a==="reopen"){const q=DS(V.di);q.done=0;delete q.e}
  else if(a==="setup"){V.view="setup";scrollTo(0,0)}
  else if(a==="back"){V.view="train";scrollTo(0,0)}
  else if(a==="aeq"){let n="New equipment",c=1;while(n in S.p.eq)n="New equipment "+(++c);S.p.eq[n]=5}
  else if(a==="deq"){if(!exs().some(e=>e.eq===b.dataset.q))delete S.p.eq[b.dataset.q];else alert("Some exercises use this equipment.")}
  else if(a==="aex")S.p.days[i].ex.push({id:"x"+Date.now(),name:"New exercise",eq:Object.keys(S.p.eq)[0],start:45,goal:8,sets:3,ramp:[]});
  else if(a==="dex")S.p.days[+b.dataset.d].ex.splice(i,1);
  else if(a==="aday")S.p.days.push({name:"Day "+(S.p.days.length+1),ex:[]});
  else if(a==="dday"){if(V.ask!=="d"+i)V.ask="d"+i;else{V.ask=null;S.p.days.splice(i,1);S.day=0}}
  else if(a==="exp"){S.bk=Date.now();save();const t=$("#bk");t.value=JSON.stringify(S);t.select();try{navigator.clipboard.writeText(t.value)}catch(e){}$("#bm").textContent="Backup text ready. If it didn’t copy, select it and copy manually.";return}
  else if(a==="imp"){try{const o=JSON.parse($("#bk").value);if(!o.p||!o.logs)throw 0;S=migrate(o);V.view="train";V.msg="Restored."}catch(e){$("#bm").textContent="That text isn’t a valid backup.";return}}
  render();
});
render();
document.addEventListener("visibilitychange",()=>{if(document.hidden&&dirty){clearTimeout(tm);push()}});
(async()=>{try{
  if(!window.claude||!claude.use)return;
  const db=await claude.use("db"),u=await claude.use("user");if(!db||!u)return;
  const id=await u.id();if(!id)return;
  CL=db.collection("data/users/"+id).doc("state");
  const s=await CL.get();
  if(s.exists&&s.data()&&s.data().json&&!dirty){S=JSON.parse(s.data().json);last=JSON.stringify(S);V.sync="cloud";render()}
  else{V.sync="cloud";push();render()}
}catch(e){}})();
</script></body></html>
