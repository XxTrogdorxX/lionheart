<style>

  const X=v=>x1===x0?L+(W-L-Rr)/2:L+(v-x0)/(x1-x0)*(W-L-Rr),Y=v=>T+(1-(v-y0)/(y1-y0))*(H-T-B);
  const sel=V.sel!=null&&pts[V.sel]?V.sel:pts.length-1;
  const lab=p=>g.dm?dstr(p.x):"W"+p.wk;
  const grid=[0,.5,1].map(f=>{const v=y0+(y1-y0)*f,y=Y(v).toFixed(1);return `<line x1="${L}" x2="${W-Rr}" y1="${y}" y2="${y}" style="stroke:var(--line)" stroke-width="1"/><text x="${L-6}" y="${+y+4}" text-anchor="end" style="fill:var(--mut)" font-size="11">${Math.round(v)}</text>`}).join("");
  const line=pts.length>1?`<polyline fill="none" style="stroke:var(--ac)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${pts.map(p=>X(p.x).toFixed(1)+","+Y(p.y).toFixed(1)).join(" ")}"/>`:"";
  const dots=pts.map((p,i)=>{const cx=X(p.x).toFixed(1),cy=Y(p.y).toFixed(1);return `<circle cx="${cx}" cy="${cy}" r="${i===sel?6:4}" style="fill:var(--ac);stroke:var(--card)" stroke-width="2"/><circle data-pt="${i}" cx="${cx}" cy="${cy}" r="16" fill="transparent"/>`}).join("");
  const f=pts[0],l=pts[pts.length-1];
  const xl=`<text x="${X(f.x).toFixed(1)}" y="${H-8}" text-anchor="${pts.length>1?"start":"middle"}" style="fill:var(--mut)" font-size="11">${lab(f)}</text>`+(pts.length>1?`<text x="${X(l.x).toFixed(1)}" y="${H-8}" text-anchor="end" style="fill:var(--mut)" font-size="11">${lab(l)}</text>`:"");
  const sp=pts[sel];
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(name)} progress, ${pts.length} points, latest ${fmt(l.y)} ${unit}">${grid}${line}${dots}${xl}</svg>
<div style="margin-top:6px"><b>${lab(sp)}</b> · ${fmt(sp.y)} ${unit}</div>${g.est?'<div class="mut" style="font-size:12px;margin-top:4px">Weeks before dated history are placed by week number.</div>':""}`;
}
function movPage(){

  const sets=msets(mv),gm=mv.t?"sec":(V.gm||"e1rm");

  let recs;

  else{const a=best(sets,MET.e1rm),w=best(sets,MET.wt),v=best(sets,MET.vol),st=b=>b.s.w+" lb × "+b.s.r+" · "+whenTxt(b.s);
    recs=card("Heaviest weight",w,w&&[fmt(w.v)+" lb",st(w)])+card("Best estimated 1RM",a,a&&[fmt(a.v)+" lb",st(a)])+card("Best single-set volume",v,v&&[n0(v.v)+" lb",st(v)])}

<section class="card"><h2>Progress</h2>${mv.t?"":seg([["e1rm","Est. 1RM"],["wt","Weight"],["vol","Volume"]],gm,"gm")}${seg([["4","4 wks"],["12","12 wks"],["all","All"]],V.gr||"all","gr")}${chart(g,unit,mv.name)}</section>`;

function render(){

const setPath=(o,path,v)=>{const k=path.split(".");let c=o;for(let i=0;i<k.length-1;i++)c=c[k[i]];c[k[k.length-1]]=v};

  {const c=ev.target.closest&&ev.target.closest("circle[data-pt]");if(c){V.sel=+c.dataset.pt;render();return}}

  else if(a==="imp"){try{const o=JSON.parse($("#bk").value);if(!o.p||!o.logs)throw 0;S=migrate(o);V.view="train";V.msg="Restored."}catch(e){$("#bm").textContent="That text isn’t a valid backup.";return}}

const AUTH=["amode","forgot","retry","so"];
const syncText=()=>!SBON?"saved on this phone only":V.sync==="cloud"?"saved to your account":V.sync==="offline"?"saved on this phone, will sync when online":"saving…";
function syncUI(){const x=document.getElementById("sy");if(x)x.textContent=syncText()}
const setMsg=m=>{V.amsg=m;const x=document.getElementById("amsg");if(x)x.textContent=m};
const friendly=e=>{const m=String(e&&e.message||e);return/invalid login/i.test(m)?"Email or password is wrong.":/not confirmed/i.test(m)?"Confirm your email first (check your inbox), then sign in.":/already/i.test(m)?"That email already has an account. Try signing in.":/rate|limit|seconds/i.test(m)?"Too many attempts or emails. Wait a few minutes and try again.":m}
function acct(){return SBON&&U?`<section class="card"><h2>Account</h2><div class="mut">Signed in as ${esc(UE)}</div><div class="mut">${syncText()}</div><button style="margin-top:8px" data-a="so">${V.ask==="so"?"Not synced yet. Tap again to sign out anyway":"Sign out"}</button></section>`:""}
function authScreen(){
  if(V.auth==="loading")return `<h1>Lionheart Lifting</h1><div class="mut">Loading…</div>`;
  if(V.auth==="err")return `<h1>Lionheart Lifting</h1><section class="card"><div>Couldn’t reach your account, and this phone has no saved copy to show.</div><div class="mut" style="margin-top:6px">Check your signal and try again. Your data is safe in your account.</div><button class="pri" style="width:100%;margin-top:10px" data-a="retry">Try again</button></section>`;
  if(V.auth==="recover")return `<h1>Choose a new password</h1><form id="rf" class="card"><label class="f">New password (8+ characters)<input id="np" type="password" autocomplete="new-password" minlength="8" required></label><button class="pri" style="width:100%;margin-top:12px">Save password</button><div class="mut" id="amsg" style="margin-top:8px">${esc(V.amsg||"")}</div></form>`;
  const up=V.am==="up";
  return `<h1>Lionheart Lifting</h1><div class="mut">Sign in to save your training to your account.</div>
<div class="tabs"><button type="button" class="${up?"":"sel"}" data-a="amode" data-m="in">Sign in</button><button type="button" class="${up?"sel":""}" data-a="amode" data-m="up">Create account</button></div>
<form id="af" class="card"><label class="f">Email<input id="em" type="email" inputmode="email" autocomplete="username" value="${esc(V.em||"")}" required></label>
<label class="f" style="margin-top:8px">Password${up?" (8+ characters)":""}<input id="pw" type="password" autocomplete="${up?"new-password":"current-password"}" minlength="8" required></label>
<button class="pri" style="width:100%;margin-top:12px">${up?"Create account":"Sign in"}</button>
<div class="mut" id="amsg" style="margin-top:8px">${esc(V.amsg||"")}</div>${up?"":'<button type="button" class="lnk" data-a="forgot">Forgot password?</button>'}</form>`;
}
async function push(){
  if(!sb||!U||pushing||V.auth!=="app")return;
  pushing=true;V.sync="saving";syncUI();
  try{
    if(V.rc){const r=await sb.from("user_state").select("state").eq("user_id",U).maybeSingle();if(r.error)throw r.error;V.rc=0;const c=r.data&&r.data.state;
      if(c&&(c.u||0)>(S.u||0)){S=migrate(c);last=JSON.stringify(S);try{localStorage.setItem(LK,last)}catch(e){}dirty=false;V.sync="cloud";pushing=false;render();return}}
    const snap=S.u;
    const r=await sb.from("user_state").upsert({user_id:U,state:S,updated_at:new Date().toISOString()});
    if(r.error)throw r.error;
    V.sync="cloud";
    if(S.u===snap)dirty=false;else{pushing=false;return push()}
  }catch(e){V.sync="offline";clearTimeout(rt);rt=setTimeout(push,15000)}
  pushing=false;syncUI();
}
async function refresh(){
  if(!sb||!U||dirty||pushing||V.auth!=="app")return;
  try{const r=await sb.from("user_state").select("state").eq("user_id",U).maybeSingle();if(r.error)throw r.error;const c=r.data&&r.data.state;
    if(c&&(c.u||0)>(S.u||0)&&!dirty){S=migrate(c);last=JSON.stringify(S);try{localStorage.setItem(LK,last)}catch(e){}V.sync="cloud";render()}else{V.sync="cloud";syncUI()}}catch(e){}
}
async function loadUser(){
  V.auth="loading";render();
  LK="lh_u_"+U;
  let loc=null;try{loc=JSON.parse(localStorage.getItem(LK))}catch(e){}
  let cloud=null,bad=false;
  try{const r=await sb.from("user_state").select("state").eq("user_id",U).maybeSingle();if(r.error)throw r.error;cloud=r.data&&r.data.state||null}catch(e){bad=true}
  let up=false;
  const hasEx=s=>!!(s&&s.p&&s.p.days&&s.p.days.some(d=>d.ex.length));
  let leg=null;try{if(!localStorage.getItem("lh1_claimed"))leg=JSON.parse(localStorage.getItem("lh1"))}catch(e){}
  const legOK=hasEx(leg),claim=()=>{try{localStorage.setItem("lh1_claimed",U)}catch(e){}};
  if(bad){if(loc){S=loc;up=true}else{V.auth="err";render();return}}
  else if(cloud){
    if(!hasEx(cloud)&&!hasEx(loc)&&legOK){S=leg;claim();up=true}
    else if(loc&&(loc.u||0)>(cloud.u||0)){S=loc;up=true}
    else S=cloud;
  }else{
    if(loc&&(hasEx(loc)||!legOK))S=loc;
    else if(legOK){S=leg;claim()}
    else S=fresh();
    up=true;
  }
  S=migrate(S);last=JSON.stringify(S);
  try{localStorage.setItem(LK,last);localStorage.setItem("lh_last",U)}catch(e){}
  V.auth="app";V.view=exs().length?"train":"setup";V.tab="new";V.open={};V.day=0;
  V.sync=up?"saving":"cloud";if(up)dirty=true;if(bad)V.rc=1;
  render();
  if(up){if(bad){V.sync="offline";syncUI();clearTimeout(rt);rt=setTimeout(push,15000)}else push()}
}
function offlineLoad(){
  try{const u=localStorage.getItem("lh_last");LK="lh_u_"+u;S=migrate(JSON.parse(localStorage.getItem(LK)));last=JSON.stringify(S);V.auth="app";V.sync="offline";V.view=exs().length?"train":"setup"}catch(e){V.auth="err"}
  render();
}
function onSession(ev,s){
  if(ev==="PASSWORD_RECOVERY")V.rec=1;
  if(s&&s.user){
    UE=s.user.email||"";
    if(V.rec){U=s.user.id;V.auth="recover";render();return}
    if(U!==s.user.id){U=s.user.id;loadUser()}
    return;
  }
  if(ev==="INITIAL_SESSION"&&navigator.onLine===false&&localStorage.getItem("lh_last")){offlineLoad();return}
  U=null;UE="";LK="lh1";dirty=false;S=migrate(fresh());last=JSON.stringify(S);V.auth="in";V.am=V.am||"in";V.ask=null;render();
}
async function authSubmit(){
  const em=document.getElementById("em").value.trim(),pw=document.getElementById("pw").value,up=V.am==="up";V.em=em;
  if(!em||pw.length<8){setMsg("Enter your email and a password of at least 8 characters.");return}
  setMsg("Working…");
  try{
    if(up){const r=await sb.auth.signUp({email:em,password:pw,options:{emailRedirectTo:location.origin+location.pathname}});if(r.error)throw r.error;
      if(!r.data||!r.data.session){V.am="in";V.amsg="Check your email for a confirmation link, then come back and sign in.";render()}}
    else{const r=await sb.auth.signInWithPassword({email:em,password:pw});if(r.error)throw r.error}
  }catch(e){setMsg(friendly(e))}
}
async function recSubmit(){
  const np=document.getElementById("np").value;if(np.length<8){setMsg("Use at least 8 characters.");return}
  setMsg("Working…");
  try{const r=await sb.auth.updateUser({password:np});if(r.error)throw r.error;V.rec=0;V.amsg="";try{history.replaceState(null,"",location.pathname)}catch(e){}loadUser()}catch(e){setMsg(friendly(e))}
}
async function authAct(a,b){
  if(a==="amode"){V.am=b.dataset.m;V.amsg="";render();return}
  if(a==="retry"){if(sb&&U)loadUser();else location.reload();return}
  if(a==="forgot"){
    const em=((document.querySelector("#em")||{}).value||"").trim();V.em=em;
    if(!em){setMsg("Type your email above first, then tap Forgot password.");return}
    try{const r=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});if(r.error)throw r.error;setMsg("If that email has an account, a reset link is on its way.")}catch(e){setMsg(friendly(e))}
    return}
  if(a==="so"){
    if(dirty){clearTimeout(tm);await push()}
    if(dirty&&V.ask!=="so"){V.ask="so";render();return}
    V.ask=null;try{await sb.auth.signOut()}catch(e){}
  }
}
document.addEventListener("submit",ev=>{ev.preventDefault();const id=ev.target.id;if(id==="af")authSubmit();else if(id==="rf")recSubmit()});
document.addEventListener("visibilitychange",()=>{if(document.hidden){if(dirty){clearTimeout(tm);push()}}else refresh()});
window.addEventListener("online",()=>{if(dirty)push();else refresh()});
if(SBON){
  V.auth="loading";
  if(window.supabase){try{sb=window.supabase.createClient(SB.url,SB.key);sb.auth.onAuthStateChange((ev,s)=>setTimeout(()=>onSession(ev,s),0))}catch(e){sb=null}}
  if(!sb){if(localStorage.getItem("lh_last"))offlineLoad();else V.auth="err"}
}
render();
